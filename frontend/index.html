<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Splitwiser</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#e4e7f5" />
    <meta name="description" content="Split expenses with friends and groups" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitwiser" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://splitwiser.fly.dev/" />
    <meta property="og:title" content="Splitwiser" />
    <meta property="og:description" content="Split expenses with friends and groups" />
    <meta property="og:image" content="https://splitwiser.fly.dev/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Splitwiser" />
    <meta name="twitter:description" content="Split expenses with friends and groups" />
    <meta name="twitter:image" content="https://splitwiser.fly.dev/og-image.png" />
  </head>
  <body>
    <script>
      // Apply dark mode immediately before page renders to prevent white flash
      const isDark = localStorage.getItem('theme') === 'dark' ||
          (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        document.documentElement.classList.add('dark');
        // Update theme-color for dark mode
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161826');
      }

      // iOS Safari ignores user-scalable=no in the viewport meta; cancelling
      // the (WebKit-only) gesture events is what actually stops a pinch from
      // zooming the app there.
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
