# Reusable test suites, called by tests.yml (pull requests) and deploy.yml
# (before shipping to Fly.io). Not triggered directly — edit the callers to
# change when it runs.

name: Test suites

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test. Defaults to the commit that triggered the run.'
        required: false
        type: string
        default: ''

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    env:
      # The suite runs against in-memory SQLite with all outbound calls mocked.
      # A dummy signing key keeps auth.py from falling back to its insecure
      # development default.
      SECRET_KEY: test-secret-key-for-ci-only
      SPLITWISER_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the production image (Dockerfile.fly).
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  backend-lint:
    name: Backend (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Ruff
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check .

  lint:
    name: Frontend (eslint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Fails on any error, and on more than the 13 warnings currently
      # accepted — so the known backlog cannot grow. Lower the ceiling in
      # package.json as those are worked off.
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint:ci

  # `npm run test` and `npm run lint:ci` never invoke tsc, so a type error —
  # or an import of a file that was never committed — passed every check here
  # and only surfaced in the Dockerfile's `npm run build` at deploy time. This
  # runs the same build CI would otherwise never see.
  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the production build stage (Dockerfile.fly).
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # tsc -b && vite build — the same command the Docker image runs.
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the production build stage (Dockerfile.fly).
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test
