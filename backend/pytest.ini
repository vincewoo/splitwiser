[pytest]
# backend/ is not a package — its modules are imported as top-level names
# (`import auth`, `import models`, `from utils.splits import ...`). Running
# `python -m pytest` happens to put the working directory on sys.path, but the
# `pytest` console script does not, so the two invocations behaved differently
# and only the former worked. Set it explicitly instead of relying on that.
pythonpath = .

# Bare `pytest` should collect the suite only. Several modules elsewhere in the
# tree are named test_* but are manual scripts, not pytest tests
# (test_email_config.py).
testpaths = tests
